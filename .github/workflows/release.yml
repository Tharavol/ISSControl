name: Release

# Builds the standalone ISSControl.exe (see ISSControl.spec) and attaches it
# to a GitHub Release whenever a version tag is pushed. Tests run first so a
# broken build never gets published.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,build]"

      - name: Run tests
        run: pytest

      - name: Build ISSControl.exe
        run: pyinstaller ISSControl.spec

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/ISSControl.exe --generate-notes
