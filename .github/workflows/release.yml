name: Release

# Zips the source files needed to `pip install` this project and attaches
# that zip to a GitHub Release whenever a version tag is pushed. Tests run
# first so a broken build never gets published. No compiled artifact is
# built -- see #22: anyone running ISSControl already needs a Python
# environment to have installed iShareScreen into in the first place, so a
# standalone exe (v1.3.0's approach) added build complexity without
# removing the one dependency (Python) it would need to matter.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Build source zip
        shell: pwsh
        # git archive rather than a manual file copy: it packs the tracked
        # tree straight from the index, so gitignored cruft a prior step
        # left lying around on the runner (e.g. isscontrol/__pycache__/
        # from the pytest run above) can't end up in the release zip.
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          git archive --format=zip `
            --prefix="ISSControl-${{ github.ref_name }}/" `
            -o "dist/ISSControl-${{ github.ref_name }}.zip" `
            HEAD -- isscontrol isscontrol.pyw pyproject.toml README.md LICENSE CHANGELOG.md AUTHORS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/ISSControl-${{ github.ref_name }}.zip --generate-notes
